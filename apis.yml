name: Soldsie
description: >-
  Soldsie was a social-commerce platform founded in 2012 in San Francisco by Chris Bennett and
  Arrel Gray that let retailers sell directly through social media: customers bought products by
  commenting "Sold" on a merchant's Facebook or Instagram post, while a backend dashboard handled
  invoicing, customer tracking, and waitlists. Backed by 500 Startups (now 500 Global) and
  e.ventures, it raised roughly $1M in seed funding and a $4M Series A (2014), and had processed
  over $25M in transactions across more than 1,000 merchants. The product is now defunct: the
  soldsie.com apex no longer resolves and www.soldsie.com returns a broken redirect, so there is
  no live developer portal, API, or documentation surface to enrich.
